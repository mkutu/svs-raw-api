# Snakemake Configuration for SVS RAW Processing Pipeline
# SCINet Ceres - USDA

# Processing mode
# - single: Process one batch at a time (specify batch_id)
# - batch: Process all batches in ceres_scratch directory
mode: single
batch_id: ""  # Set via command line: --config batch_id=MD_2025-10-22

# Storage paths
paths:
  # Repository root
  repo_root: /home/matthew.kutugata/repos/svs-raw-api
  
  # Input: Ceres fast scratch storage (90-day)
  ceres_scratch: /90daydata/dash_agir/data/semifield-upload
  
  # Output: Final destination (permanent storage)
  output_base: /project/dash_agir/matthew.kutugata/semifield-developed-images
  
  # Configuration files
  svs_tags: /home/matthew.kutugata/repos/svs-raw-api/data/profiles/svs_tags.yaml
  color_matrix: /home/matthew.kutugata/repos/svs-raw-api/data/profiles/MD_calibration_matrix_optimized.npy
  pp3_profile: /home/matthew.kutugata/repos/svs-raw-api/data/profiles/MD_shr661_raw16.pp3
  
  # RawTherapee CLI
  rawtherapee_cli: /home/matthew.kutugata/SemiF-Preprocessing/squashfs-root/usr/bin/rawtherapee-cli

# Image dimensions (SVS camera specific)
processing:
  height: 3024
  width: 4032
  
  # Processing threads per image
  threads_per_image: 4
  
  # Cleanup options
  cleanup_dngs: false    # Keep DNGs after JPG creation
  cleanup_raw: false      # Keep RAW files in scratch

# Database tracking
database:
  path: /project/dash_agir/matthew.kutugata/pipeline_tracking.db

# SLURM resources (per image processing job)
slurm:
  partition: short
  account: dash_agir
  time: "04:00:00"
  mem_per_cpu: 4GB
  cpus_per_task: 4
  ntasks: 1
  
  # Maximum parallel jobs
  max_parallel_jobs: 12

# Logging
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
